name: Agent evals

# Regression-test the config that steers the agents (AGENTS.md/CLAUDE.md,
# skills, agents, hooks) whenever it changes, plus a nightly cadence. The
# pass-rate threshold is a merge check — a config change that drops it is
# reviewed before it merges (see evals/README.md).

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.codex/**'
      - '.opencode/**'
      - '.agents/**'
      - 'hooks/**'
      - 'evals/**'
  schedule:
    - cron: '0 2 * * *'

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One runner per supported agent. Each org enables the runners it has
        # keys/model access for; uncomment the ones you use.
        agent:
          - claude
          # - codex
          # - opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Claude Code
        if: matrix.agent == 'claude'
        run: npm install -g @anthropic-ai/claude-code
      # - name: Install Codex
      #   if: matrix.agent == 'codex'
      #   run: npm install -g @openai/codex
      # - name: Install opencode
      #   if: matrix.agent == 'opencode'
      #   run: curl -fsSL https://opencode.ai/install | bash

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT: ${{ matrix.agent }}
        run: python3 evals/run.py --agent "$AGENT" --threshold 0.8
