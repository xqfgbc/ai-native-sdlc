# Version catalog — the single source of truth for every dependency version.
# The platform team owns these versions; feature changes never bump them
# (see AGENTS.md §7 escalation and CLAUDE.md "Things agents get wrong").
#
# Stack (verified 24 Nov 2026):
#   - JDK 21 (Spring Boot 4.x floor is Java 17; we standardise on 21 LTS)
#   - Spring Boot 4.1.x  — NOTE: 4.1.5 was requested but is not published;
#     the latest 4.1.x patch is 4.1.3 (19 Nov 2026). 4.2.0 is the newest line.
#   - Spring Cloud 2025.1.5 ("Oakwood") — pairs with Spring Boot 4.0.x/4.1.x.
#   - Kubernetes-native service discovery (spring-cloud-kubernetes), NOT Eureka.
#   - Spring Cloud Config for externalised configuration.
#   - AWS RDS PostgreSQL in production; Testcontainers in integration tests.

[versions]
java = "21"
spring-boot = "4.1.3"
spring-cloud = "2025.1.5"
checkstyle = "10.12.5"
# Testcontainers is not managed by the Spring Boot BOM. Pin it here and verify
# at https://java.testcontainers.org when the platform team upgrades.
testcontainers = "1.20.6"
# gRPC Netty transport: Spring Cloud Gateway 5.x's JSON-to-gRPC auto-config
# needs it on the classpath. Matches the grpc version managed by the Cloud BOM.
grpc = "1.84.1"
# ArchUnit: deterministic architecture/layering guardrail (see architecture-guardrails skill).
archunit = "1.5.1"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

[libraries]
# BOMs (imported as platform constraints in platform/build.gradle.kts).
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Boot starters (unversioned — resolved through the platform module constraints).
# Spring Boot 4.x renamed spring-boot-starter-web -> spring-boot-starter-webmvc.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Testcontainers integration: @ServiceConnection auto-configures the datasource.
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring Cloud (Oakwood, 5.x line). Coordinates renamed from the 3.x/4.x era:
#   spring-cloud-starter-gateway              -> spring-cloud-starter-gateway-server-webflux
#   spring-cloud-starter-kubernetes-client-discovery -> spring-cloud-starter-kubernetes-client
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-starter-kubernetes-client = { module = "org.springframework.cloud:spring-cloud-starter-kubernetes-client" }
spring-cloud-starter-kubernetes-client-config = { module = "org.springframework.cloud:spring-cloud-starter-kubernetes-client-config" }
spring-cloud-starter-config = { module = "org.springframework.cloud:spring-cloud-starter-config" }
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }

# Databases (versions flow from the Spring Boot BOM).
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# Testcontainers (explicitly versioned; import the BOM, then use unversioned modules).
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

# gRPC Netty transport (gateway JSON-to-gRPC auto-config).
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }

# ArchUnit JUnit 5 — architecture tests that fail the build on layering/design violations.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
