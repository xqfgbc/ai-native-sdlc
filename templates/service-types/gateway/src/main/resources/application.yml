server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    # Fail-open: boot without the Config Server (local). In the cluster the
    # address resolves via Kubernetes DNS to the config-server Service.
    import: "optional:configserver:http://config-server:8888"
  cloud:
    gateway:
      server:
        webflux:
          # Explicit routes. Add one block per service (Path=/api/<base>/** ->
          # lb://<service>), kept in sync with the accepted spec.md. In a
          # cluster, Kubernetes-native discovery resolves lb:// via the
          # DiscoveryClient; the discovery locator can auto-route the rest:
          #   spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
          routes:
            - id: reference-service
              uri: lb://reference-service
              predicates:
                - Path=/api/reference/**
    kubernetes:
      discovery:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
