name: Collect execution report

# Incremental collector on every push; if configured, opens a PR with the report in the
# management repo. Set the repo variable MANAGEMENT_REPO=org/<project>-management and the
# secret SYNC_TOKEN (GitHub App / fine-grained PAT). See docs/github-automation.md.
on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: hashFiles('build.gradle.kts') != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Collect (incremental)
        run: bash .sdlc/collect.sh

      - name: Upload report as PR to the management repo
        env:
          MANAGEMENT_REPO: ${{ vars.MANAGEMENT_REPO }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          SERVICE="$(jq -r .service .sdlc/config.json)"
          bash scripts/upload-report.sh "$MANAGEMENT_REPO" "sync/reports/$SHA.json" "build" "$SERVICE" "$SHA"
