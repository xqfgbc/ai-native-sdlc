# Local profile: H2, no Config Server, no Kubernetes discovery.
spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:app;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    kubernetes:
      discovery:
        enabled: false
