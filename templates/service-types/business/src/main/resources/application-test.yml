# Test profile: H2 for cheap unit/slice/context tests only.
# SQL-specific behaviour is covered by src/itest with Testcontainers PostgreSQL.
spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:app_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    kubernetes:
      discovery:
        enabled: false
