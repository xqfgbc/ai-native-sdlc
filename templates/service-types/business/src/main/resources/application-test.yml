# Test profile: H2 by default; integration tests override with Testcontainers.
spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:app_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    kubernetes:
      discovery:
        enabled: false
