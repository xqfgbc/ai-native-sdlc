server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: {{SERVICE}}
  config:
    import: "optional:configserver:http://config-server:8888"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/{{SERVICE}}}
    username: ${DB_USERNAME:{{SERVICE}}}
    password: ${DB_PASSWORD:{{SERVICE}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  cloud:
    kubernetes:
      discovery:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
