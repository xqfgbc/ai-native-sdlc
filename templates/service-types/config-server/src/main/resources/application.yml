server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Local default: filesystem backend over ./config-repo/.
    # Production: activate the `git` profile (see the commented block) so the
    # server reads per-service, per-environment config from the infra repo.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:./config-repo/
        # git:
        #   uri: https://github.com/<org>/<project>-infra.git
        #   search-paths: config
        #   default-label: main
        #   clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
