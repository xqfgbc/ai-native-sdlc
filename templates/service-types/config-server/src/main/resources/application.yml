server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # 本地默认：native 文件系统后端，读 ./config/。
    # 生产/非生产：启用 `git` profile，从对应环境的配置数据仓读取
    # （<project>-prod-configuration-data / <project>-devops-configuration-data）。
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:file:./config/}
        # git:
        #   uri: ${CONFIG_GIT_URI:https://github.com/<org>/<project>-prod-configuration-data.git}
        #   search-paths: .
        #   default-label: main
        #   clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
