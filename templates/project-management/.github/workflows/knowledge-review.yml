name: Knowledge review

# Daily/manual review: refresh AI pre-judgement and the debt due report. Never activates anything.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh proposal reviews and debt due report
        run: |
          bash scripts/review-proposals.sh .
          bash scripts/debt.sh report --out loop/07-maintain/debt/DUE.md
      - name: Commit review artifacts
        run: |
          git config user.name "sdlc-reviewer"
          git config user.email "sdlc-reviewer@users.noreply.github.com"
          git add knowledge/reviews loop/07-maintain/debt/DUE.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "[AI-Agent] #N/A chore: refresh knowledge review"
            git push
          fi
